<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #2b2d42, #8d99ae);
      font-family: Arial, sans-serif;
      height: 100vh;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }
    .login {
      width: 320px;
      padding: 40px 30px;
      background: #eee;
      border-radius: 60% / 10%;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #573b8a;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #6d44b8;
    }
    #message {
      margin-top: 15px;
      font-size: 1em;
      font-weight: bold;
    }
    #web-content {
      display: none;
      padding: 30px;
      text-align: center;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container" id="login-container">
    <div class="login">
      <form onsubmit="handleLogin(event)">
        <label>Login</label>
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <div id="message"></div>
      </form>
    </div>
  </div>

  <!-- Konten Website Setelah Login -->
  <div id="web-content">
    <h1>Selamat Datang!</h1>
    <p>Ini adalah isi website yang hanya bisa diakses setelah login.</p>
    <p>Silakan tambahkan konten website kamu di sini.</p>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      
      const correctEmail = "jall@email.com";
      const correctPassword = "11181911";

      if (email === correctEmail && password === correctPassword) {
        message.innerText = "Benar";
        message.style.color = "green";

        setTimeout(() => {
          // Sembunyikan login dan tampilkan isi web
          document.getElementById("login-container").style.display = "none";
          document.getElementById("web-content").style.display = "block";
        }, 1000);
      } else {
        message.innerText = "Salah";
        message.style.color = "red";
      }
    }
  </script>
</body>
    </html>
